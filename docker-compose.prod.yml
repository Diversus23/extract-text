# Один образ для обоих сервисов: GIGAAM_QUANTIZATION (пусто = fp32, int8) из .env или
# окружения выбирает веса при сборке; в образ они попадают вместе с настройкой рантайма.
x-build: &build
  context: .
  args:
    GIGAAM_QUANTIZATION: ${GIGAAM_QUANTIZATION:-}

services:
  api:
    container_name: extract-text-prod
    build: *build
    # Перебиваем dev-volume ./app:/code/app — в prod код используется только из образа.
    volumes: []
    command: >
      sh -c "
        CALCULATED_WORKERS=$$(expr 2 \* $${CPU_CORES:-4} + 1);
        exec uvicorn app.main:app --host 0.0.0.0 --port $${API_PORT:-7555} --workers $${WORKERS:-$$CALCULATED_WORKERS}
      "
    restart: always
    env_file:
      - .env
    environment:
      # Распознавание речи вынесено в отдельный сервис api-audio: иначе каждый из
      # воркеров (2*CPU+1) держал бы свою копию модели в памяти.
      - ENABLE_TRANSCRIPTION=false
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Сервис расшифровки аудио (POST /v1/transcribe): тот же образ, один воркер,
  # модель загружается один раз. Порт 7556.
  api-audio:
    container_name: extract-text-audio-prod
    build: *build
    command: uvicorn app.main:app --host 0.0.0.0 --port 7556 --workers 1
    ports:
      - "7556:7556"
    restart: always
    env_file:
      - .env
    environment:
      # os.cpu_count() внутри контейнера видит все ядра хоста, а не лимит cpus, поэтому
      # потоки задаются явно: TRANSCRIPTION_THREADS из .env, иначе AUDIO_CPUS (по умолчанию 4)
      - TRANSCRIPTION_THREADS=${TRANSCRIPTION_THREADS:-${AUDIO_CPUS:-4}}
    deploy:
      resources:
        limits:
          # fp32-модель занимает около 1.5 ГБ; значение уточняется замером на целевом сервере
          memory: 4G
          cpus: '${AUDIO_CPUS:-4}'
        reservations:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      # Проба готовности: 200 только когда модель распознавания загружена
      test: ["CMD", "curl", "-f", "http://localhost:7556/health?check=transcription"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
